<div class="faq-section animate-on-scroll">
  @if (showTitle) {
    <h2 class="section-title text-center mb-5">{{ title }}</h2>
  }

  <div class="row justify-content-center">
    <div class="col-lg-10">
      <div class="faq-container">
        @for (faq of faqItems; track faq; let i = $index) {
          <div
            class="faq-item"
            [class.active]="expandedFaqIndex === i"
            >
            <div class="faq-question" (click)="toggleFaq(i)">
              <h3>{{ faq.question }}</h3>
              <div class="faq-icon">
                <i
                  class="bi"
                  [class.bi-plus]="expandedFaqIndex !== i"
                  [class.bi-dash]="expandedFaqIndex === i"
                ></i>
              </div>
            </div>
            <div class="faq-answer" [class.show]="expandedFaqIndex === i">
              <p>{{ faq.answer }}</p>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</div>
