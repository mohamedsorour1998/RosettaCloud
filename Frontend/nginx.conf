# Hardened nginx main config for a non-root container on :8080.
# pid + temp paths live under /tmp so the container works with a
# readOnlyRootFilesystem (mount an emptyDir at /tmp). Logs go to stdout/stderr.
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # All writable scratch paths under /tmp (emptyDir when readOnlyRootFilesystem=true)
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Log to container stdout/stderr — no filesystem writes required.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    server {
        listen       8080;
        listen       [::]:8080;
        server_name  _;
        root   /usr/share/nginx/html;
        index  index.html;

        # SPA fallback so client-side routes resolve to index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Long-lived caching for fingerprinted static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
