# Plan 2 — Phase 3/5 — dedicated `labs` namespace for the privileged interactive-lab pods.
# Ref: DevSecOps/POD-SECURITYCONTEXT-HARDENING-PLAN.md §5.5, §6.1, §9.2
#
# WHY A SEPARATE NAMESPACE
#   Lab pods run privileged Docker-in-Docker + Kind and CANNOT satisfy PSS `restricted`
#   (or even `baseline`). Isolating them in their own namespace is what lets `dev` become
#   `restricted` without evicting the labs (§5.2, §5.5).
#
# POD SECURITY ADMISSION — enforce=PRIVILEGED (Plan 2 §5.5 cutover, ACTIVE)
#   CRITICAL: `Fabric8LabProvisioner.createPod()` sets `privileged: true` + `runAsUser: 0`.
#   PSS `baseline` AND `restricted` both REJECT privileged containers, so `labs` MUST enforce
#   `privileged` — the most-permissive level, which never blocks. This is exactly what lets
#   `dev` run `enforce=restricted` (applied together) while lab pods run here (§9.2 end-state).
#   warn/audit are set to `baseline` (not `restricted`) so the signal is meaningful for a
#   deliberately-privileged namespace instead of a wall of guaranteed violations.
#   After a sysbox migration drops `privileged` (§5.4), downgrade enforce -> baseline.
#
# WIRED BY (Plan 2 §5.5 cutover): .github/workflows/backend-java-deploy.yml applies this file
#   (and networkpolicies-labs.yaml) BEFORE the e2e-stack, which carries the labs-scoped RBAC +
#   LAB_K8S_NAMESPACE=labs. To return to INERT, see the revert notes in that workflow / the
#   cutover report: re-comment enforce below (restore warn/audit=restricted) and drop the wiring.
apiVersion: v1
kind: Namespace
metadata:
  name: labs
  labels:
    # Privileged DinD lab pods live here; baseline/restricted would REJECT them (§5.2, §9.2).
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/audit-version: latest
---
# Namespace-wide ceiling so a runaway fleet of labs cannot exhaust the cluster (T4).
apiVersion: v1
kind: ResourceQuota
metadata:
  name: labs-quota
  namespace: labs
spec:
  hard:
    pods: "50"
    requests.cpu: "25"
    requests.memory: 50Gi
    limits.cpu: "100"
    limits.memory: 150Gi
    requests.ephemeral-storage: 200Gi
---
# Per-container defaults + caps. `default`/`defaultRequest` are applied to any lab pod
# that omits resources, so the ResourceQuota above always has values to count. `max`
# caps a single lab. The defaultRequest (ephemeral 2Gi) matches the explicit request the
# provisioner now sets (§5.3) so a lab pod is schedulable even without the LimitRange.
apiVersion: v1
kind: LimitRange
metadata:
  name: labs-defaults
  namespace: labs
spec:
  limits:
    - type: Container
      default:
        cpu: "2"
        memory: 3Gi
        ephemeral-storage: 8Gi
      defaultRequest:
        cpu: 500m
        memory: 1Gi
        ephemeral-storage: 2Gi
      max:
        cpu: "4"
        memory: 6Gi
        ephemeral-storage: 16Gi
