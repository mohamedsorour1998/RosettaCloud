apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rosettacloud-ingress
  namespace: openedx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "250m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - dev.rosettacloud.app
      secretName: rosettacloud-tls
    - hosts:
        - "*.labs.dev.rosettacloud.app"
      secretName: rosettacloud-labs-tls
  rules:
    # api.dev.rosettacloud.app is served by the API Gateway + Istio strangler (path-based, to the Java
    # microservices); the legacy nginx route to the decommissioned FastAPI backend was removed, so this
    # ingress now only fronts the frontend host.
    - host: dev.rosettacloud.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rosettacloud-frontend-service
                port:
                  number: 80
    # # This is a default rule for lab subdomains
    # # Your backend will create/update more specific rules
    # - host: "lab-default.labs.dev.rosettacloud.app"
    #   http:
    #     paths:
    #       - path: /
    #         pathType: Prefix
    #         backend:
    #           service:
    #             name: interactive-labs-service
    #             port:
    #               number: 80
