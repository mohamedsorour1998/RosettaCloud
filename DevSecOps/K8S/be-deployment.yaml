# Plan 2 — §8 (adjacent scope) — STATIC hardening of the legacy FastAPI backend Deployment.
# Ref: DevSecOps/POD-SECURITYCONTEXT-HARDENING-PLAN.md §8, §3.2
#
# INTEGRATOR FLAG: the image historically runs `uvicorn … --port 80` as ROOT and bundles
# kubectl + sudo. This manifest now forces non-root uid 1000 on :8080 with a restricted
# securityContext (RO-rootfs + drop ALL caps). Validate on a real cluster before enforce:
# the FastAPI app must not need to write outside /tmp (HOME=/tmp is provided) and any
# in-container kubectl calls must tolerate a read-only rootfs. NOT applied by any CI
# pipeline (staged). Service `port` stays 80 so ingress/VirtualService/strangler routing
# is unchanged; only targetPort moves to 8080.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rosettacloud-backend-config
  namespace: dev
data:
  LAB_IMAGE_PULL_SECRET: "ecr-creds"
  LAB_K8S_NAMESPACE: "dev"
  # Kept as :latest here for initial kubectl apply; CI/CD patches this to the SHA tag after each interactive-labs build.
  LAB_POD_IMAGE: "339712964409.dkr.ecr.us-east-1.amazonaws.com/interactive-labs:latest"
  AWS_REGION: "us-east-1"
  INGRESS_NAME: "rosettacloud-ingress"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  AGENT_RUNTIME_ARN: "arn:aws:bedrock-agentcore:us-east-1:339712964409:runtime/rosettacloud_education_agent-yebWcC9Yqy"
  COGNITO_ISSUER_URL: "https://cognito-idp.us-east-1.amazonaws.com/us-east-1_jPds5WJ0I"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rosettacloud-backend
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rosettacloud-backend
  template:
    metadata:
      labels:
        app: rosettacloud-backend
    spec:
      serviceAccountName: rosettacloud-backend
      # SA token stays mounted (default) — this service calls the K8s API for lab mgmt.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rosettacloud-backend
          image: 339712964409.dkr.ecr.us-east-1.amazonaws.com/rosettacloud-backend:latest   # pin to :<sha> in CI (KSV013)
          imagePullPolicy: Always
          # Image CMD runs `uvicorn … --port 80` as root; override to non-root :8080
          # (dropping ALL caps removes NET_BIND_SERVICE, so binding a <1024 port is impossible).
          command: ["uvicorn"]
          args: ["app.main:app", "--host", "0.0.0.0", "--port", "8080"]
          ports:
            - containerPort: 8080
          env:
            - name: HOME                 # writable HOME for uvicorn/kubectl caches under RO-rootfs
              value: /tmp
            - name: LAB_IMAGE_PULL_SECRET
              valueFrom:
                configMapKeyRef:
                  name: rosettacloud-backend-config
                  key: LAB_IMAGE_PULL_SECRET
            - name: LAB_K8S_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: rosettacloud-backend-config
                  key: LAB_K8S_NAMESPACE
            - name: LAB_POD_IMAGE
              valueFrom:
                configMapKeyRef:
                  name: rosettacloud-backend-config
                  key: LAB_POD_IMAGE
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: rosettacloud-backend-config
                  key: AWS_REGION
            - name: INGRESS_NAME
              valueFrom:
                configMapKeyRef:
                  name: rosettacloud-backend-config
                  key: INGRESS_NAME
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: rosettacloud-backend-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: rosettacloud-backend-config
                  key: REDIS_PORT
            - name: AGENT_RUNTIME_ARN
              valueFrom:
                configMapKeyRef:
                  name: rosettacloud-backend-config
                  key: AGENT_RUNTIME_ARN
            - name: COGNITO_ISSUER_URL
              valueFrom:
                configMapKeyRef:
                  name: rosettacloud-backend-config
                  key: COGNITO_ISSUER_URL
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet: { path: /health-check, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 384Mi, ephemeral-storage: 128Mi }
            limits: { cpu: "1", memory: 512Mi, ephemeral-storage: 512Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }

---
apiVersion: v1
kind: Service
metadata:
  name: rosettacloud-backend-service
  namespace: dev
spec:
  selector:
    app: rosettacloud-backend
  ports:
    - protocol: TCP
      port: 80          # cluster-facing port unchanged (ingress/VirtualService/strangler route here)
      targetPort: 8080  # container now listens on unprivileged :8080
  type: ClusterIP
