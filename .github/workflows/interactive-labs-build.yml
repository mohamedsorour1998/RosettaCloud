name: Build & push interactive-labs image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "DevSecOps/interactive-labs/Dockerfile"
      - "DevSecOps/interactive-labs/**"

env:
  AWS_ACCOUNT_ID: "339712964409"
  IAM_ROLE: github-actions-role
  ECR_REPOSITORY: interactive-labs

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.IAM_ROLE }}
          aws-region: us-east-1

      - name: Login to ECR
        id: login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push
        run: |
          REGISTRY=${{ steps.login.outputs.registry }}
          SHA_TAG="${GITHUB_SHA::8}"
          IMAGE_LATEST="$REGISTRY/${{ env.ECR_REPOSITORY }}:latest"
          IMAGE_SHA="$REGISTRY/${{ env.ECR_REPOSITORY }}:$SHA_TAG"
          docker build --platform linux/amd64 \
            -f DevSecOps/interactive-labs/Dockerfile \
            DevSecOps/interactive-labs \
            -t "$IMAGE_LATEST" \
            -t "$IMAGE_SHA"
          docker push "$IMAGE_LATEST"
          docker push "$IMAGE_SHA"
          echo "Pushed $IMAGE_LATEST and $IMAGE_SHA"
          echo "sha_tag=$SHA_TAG" >> "$GITHUB_OUTPUT"
          echo "image_sha=$IMAGE_SHA" >> "$GITHUB_OUTPUT"
        id: build

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      - name: Update lab-service ConfigMap with new image tag
        run: |
          if aws eks describe-cluster --name rosettacloud-eks --region us-east-1 >/dev/null 2>&1; then
            aws eks update-kubeconfig --name rosettacloud-eks --region us-east-1
            kubectl patch configmap lab-service-config -n dev \
              --patch "{\"data\":{\"LAB_POD_IMAGE\":\"${{ steps.build.outputs.image_sha }}\"}}"
            echo "ConfigMap LAB_POD_IMAGE updated to ${{ steps.build.outputs.image_sha }}"
          else
            echo "::notice::rosettacloud-eks cluster not found — skipping ConfigMap update (NO-EKS mandate; deploy via backend-java-deploy.yml to k3s-on-runner)"
          fi

      # LAB_POD_IMAGE is consumed by lab-service (the Java lab provisioner) — the FastAPI
      # rosettacloud-backend was decommissioned. This EKS rollout is skipped under the NO-EKS mandate.
      - name: Restart lab-service to pick up new ConfigMap
        run: |
          if aws eks describe-cluster --name rosettacloud-eks --region us-east-1 >/dev/null 2>&1; then
            kubectl rollout restart deployment/lab-service -n dev
            kubectl rollout status deployment/lab-service -n dev --timeout=120s
          else
            echo "::notice::rosettacloud-eks cluster not found — skipping lab-service rollout (NO-EKS mandate; no cluster)"
          fi
