name: Frontend Deploy

# Build the Angular 22 SPA image (behind a MANDATORY Vitest test gate), push it to
# ECR, then DEPLOY that ECR image onto a k3s cluster spun up inside the public
# GitHub runner and verify it serves via a hardened, non-root Pod + HTTP smoke probe.
# No EKS / no persistent cloud infra. Mirrors .github/workflows/backend-java-deploy.yml.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag
        default: latest
        type: string
  push:
    branches: [main]
    paths:
      - "Frontend/src/**"

env:
  AWS_ACCOUNT_ID: "339712964409"
  IAM_ROLE: rosettacloud-backend-deploy
  AWS_REGION: us-east-1
  ECR_REPO: rosettacloud-frontend

permissions:
  id-token: write
  contents: read

jobs:
  build_push:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # TEST GATE — the Vitest unit suite, executed via Angular's @angular/build
      # unit-test builder (angular.json runner: vitest). Raw `vitest run` cannot be
      # used standalone here (no vitest.config; the builder injects the Angular
      # TestBed/jsdom/globals). Green on Node 24 = 62/62.
      - name: TEST GATE (Vitest via ng test)
        run: npx ng test --watch=false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.IAM_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login
        uses: aws-actions/amazon-ecr-login@v2

      # Inherits working-directory: Frontend (job default), so the build context is
      # the Frontend dir and `-f Dockerfile` resolves to Frontend/Dockerfile.
      - name: Build & push image
        run: |
          REG=${{ steps.login.outputs.registry }}
          IMG=$REG/${{ env.ECR_REPO }}
          TAG=${{ inputs.image_tag || 'latest' }}
          docker build -t "$IMG:$TAG" -t "$IMG:${GITHUB_SHA::8}" -f Dockerfile .
          docker push "$IMG:$TAG"
          docker push "$IMG:${GITHUB_SHA::8}"

  # Deploy the freshly-pushed ECR image onto k3s (in-runner) and verify it rolls out
  # and serves the SPA from a hardened, non-root, read-only-rootfs Pod.
  deploy_k3s:
    needs: build_push
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL || true

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.IAM_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install k3s (in-runner)
        run: |
          curl -sfL https://get.k3s.io | sh -s - --write-kubeconfig-mode 644 --disable traefik
          sudo ln -sf /usr/local/bin/k3s /usr/local/bin/kubectl
          timeout 150 bash -c 'until kubectl get nodes | grep -q " Ready"; do sleep 3; done'
          kubectl get nodes -o wide

      - name: Pull ECR image + import into k3s (retagged to the :e2e ref the manifest uses)
        run: |
          REG=${{ steps.login.outputs.registry }}
          TAG=${{ inputs.image_tag || 'latest' }}
          docker pull "$REG/${{ env.ECR_REPO }}:$TAG"
          docker tag  "$REG/${{ env.ECR_REPO }}:$TAG" rosettacloud-frontend:e2e
          docker save rosettacloud-frontend:e2e | sudo k3s ctr -n k8s.io images import -

      - name: Deploy hardened frontend to k3s + wait for rollout
        run: |
          kubectl create namespace dev --dry-run=client -o yaml | kubectl apply -f -
          cat <<'EOF' | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: rosettacloud-frontend
            namespace: dev
            labels:
              app: rosettacloud-frontend
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: rosettacloud-frontend
            template:
              metadata:
                labels:
                  app: rosettacloud-frontend
              spec:
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 1000
                  runAsGroup: 1000
                  fsGroup: 1000
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: rosettacloud-frontend
                    image: rosettacloud-frontend:e2e
                    imagePullPolicy: IfNotPresent
                    ports:
                      - containerPort: 8080
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      runAsNonRoot: true
                      runAsUser: 1000
                      capabilities:
                        drop: ["ALL"]
                      seccompProfile:
                        type: RuntimeDefault
                    readinessProbe:
                      httpGet:
                        path: /
                        port: 8080
                      initialDelaySeconds: 3
                      periodSeconds: 5
                      timeoutSeconds: 3
                    livenessProbe:
                      httpGet:
                        path: /
                        port: 8080
                      initialDelaySeconds: 5
                      periodSeconds: 10
                    resources:
                      requests:
                        cpu: 50m
                        memory: 64Mi
                      limits:
                        cpu: 500m
                        memory: 256Mi
                    volumeMounts:
                      - name: tmp
                        mountPath: /tmp
                volumes:
                  - name: tmp
                    emptyDir: {}
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: rosettacloud-frontend
            namespace: dev
          spec:
            selector:
              app: rosettacloud-frontend
            ports:
              - protocol: TCP
                port: 8080
                targetPort: 8080
            type: ClusterIP
          EOF
          kubectl rollout status deploy/rosettacloud-frontend -n dev --timeout=180s
          echo "=== deployed image ==="
          kubectl get deploy -n dev -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.spec.template.spec.containers[0].image}{"\n"}{end}'

      - name: Port-forward
        run: |
          kubectl port-forward -n dev svc/rosettacloud-frontend 8080:8080 &
          sleep 8

      - name: Smoke test — proves the ECR image serves the SPA on k3s
        run: |
          curl -fsS localhost:8080 | grep -qi '<app-root\|<!doctype html'
          echo "Smoke OK — SPA served from hardened non-root Pod on :8080"

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -n dev -o wide || true
          kubectl describe deploy/rosettacloud-frontend -n dev || true
          kubectl get events -n dev --sort-by=.lastTimestamp | tail -40 || true
          kubectl logs -n dev deploy/rosettacloud-frontend --tail=120 --all-containers 2>/dev/null || true
