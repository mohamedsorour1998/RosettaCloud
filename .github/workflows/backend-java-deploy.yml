name: Backend Java Deploy

# Per-service build -> ECR (with a MANDATORY test gate), then DEPLOY the ECR images onto a k3s
# cluster spun up inside the public GitHub runner and verify the rollout with a smoke probe.
# No EKS / no persistent cloud infra. Manual dispatch.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag
        default: latest
        type: string

env:
  AWS_ACCOUNT_ID: "339712964409"
  IAM_ROLE: rosettacloud-backend-deploy
  AWS_REGION: us-east-1

permissions:
  id-token: write
  contents: read

jobs:
  build_push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [user-service, lab-service, question-service, chat-service, analytics-service]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "25"
          cache: maven

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.IAM_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: TEST GATE (mvnw verify)
        working-directory: Backend-Java
        run: ./mvnw -B -ntp -pl ${{ matrix.service }} -am verify

      - name: Login to ECR
        id: login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image
        run: |
          REG=${{ steps.login.outputs.registry }}
          IMG=$REG/rosettacloud-${{ matrix.service }}
          docker build -t "$IMG:${{ inputs.image_tag }}" -t "$IMG:${GITHUB_SHA::8}" \
            -f Backend-Java/${{ matrix.service }}/Dockerfile Backend-Java
          docker push "$IMG:${{ inputs.image_tag }}"
          docker push "$IMG:${GITHUB_SHA::8}"

  # Deploy the freshly-pushed ECR images onto k3s (in-runner) and verify they roll out and serve.
  deploy_k3s:
    needs: build_push
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL || true

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.IAM_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install k3s (in-runner)
        run: |
          curl -sfL https://get.k3s.io | sh -s - --write-kubeconfig-mode 644 --disable traefik
          sudo ln -sf /usr/local/bin/k3s /usr/local/bin/kubectl
          timeout 150 bash -c 'until kubectl get nodes | grep -q " Ready"; do sleep 3; done'
          kubectl get nodes -o wide

      - name: Pull ECR images + import into k3s (retagged to the :e2e ref the manifests use)
        run: |
          REG=${{ steps.login.outputs.registry }}
          for s in user-service lab-service question-service chat-service analytics-service; do
            docker pull "$REG/rosettacloud-$s:${{ inputs.image_tag }}"
            docker tag  "$REG/rosettacloud-$s:${{ inputs.image_tag }}" rosettacloud-$s:e2e
            docker save rosettacloud-$s:e2e | sudo k3s ctr -n k8s.io images import -
          done
          docker build -q -t rosettacloud-lab-stub:e2e Backend-Java/e2e/lab-stub
          docker save rosettacloud-lab-stub:e2e | sudo k3s ctr -n k8s.io images import -

      - name: Install Istio VirtualService CRD (lab-service needs it)
        run: |
          kubectl apply -f Backend-Java/e2e/k8s/istio-crd.yaml
          kubectl wait --for condition=established --timeout=60s crd/virtualservices.networking.istio.io

      - name: Namespace + placeholder creds secret (services target in-cluster LocalStack)
        run: |
          kubectl create namespace dev --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic aws-creds -n dev \
            --from-literal=AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
            --from-literal=AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
            --from-literal=AWS_SESSION_TOKEN="$AWS_SESSION_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

      # Plan 2 / hardening-plan §5.5 CUTOVER: isolate the PRIVILEGED interactive-lab pods in a
      # dedicated `labs` namespace so `dev` can stay enforce=restricted while lab pods still run.
      # Applied BEFORE e2e-stack.yaml because that manifest carries labs-scoped RBAC (Role/RoleBinding
      # in `labs`) which needs the namespace to already exist.
      - name: Create labs namespace (PSA privileged) + quota/limits + NetworkPolicies + RBAC
        run: |
          # labs-namespace.yaml -> Namespace(enforce=privileged) + ResourceQuota + LimitRange.
          # networkpolicies-labs.yaml -> default-deny + istio-gateway ingress + kubelet-probe ingress
          # (:80 from the k3s pod CIDR 10.42.0.0/16, so readiness works under default-deny) + egress
          # guardrail (DNS + public 80/443, but BLOCK cluster RFC1918 and IMDS 169.254.169.254).
          kubectl apply -f DevSecOps/K8S/labs-namespace.yaml
          kubectl apply -f DevSecOps/K8S/networkpolicies-labs.yaml
          # labs-scoped RBAC lives HERE (not in the shared Backend-Java/e2e/k8s/e2e-stack.yaml) so the
          # sibling workflows that also apply e2e-stack.yaml (e2e-k3s.yml, frontend-e2e-fullstack.yml)
          # — which do NOT create a `labs` namespace — are unaffected by this cutover. The e2e
          # lab-service & question-service both run as the `default` SA in `dev`; grant that SA the
          # manage/exec verbs IN `labs`: lab-service creates Pods/Services/VirtualServices;
          # question-service execs (pods/exec) the -q/-c blocks into the lab pods. A RoleBinding in
          # `labs` may reference a subject SA that lives in `dev` (§5.5 step 2).
          kubectl apply -f - <<'EOF'
          apiVersion: rbac.authorization.k8s.io/v1
          kind: Role
          metadata: { name: e2e-lab-manager, namespace: labs }
          rules:
            - apiGroups: [""]
              resources: ["pods", "pods/status", "pods/exec", "services"]
              verbs: ["create", "get", "list", "watch", "delete"]
            - apiGroups: ["networking.istio.io"]
              resources: ["virtualservices"]
              verbs: ["create", "get", "list", "delete"]
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: RoleBinding
          metadata: { name: e2e-lab-manager, namespace: labs }
          subjects:
            - { kind: ServiceAccount, name: default, namespace: dev }
          roleRef: { kind: Role, name: e2e-lab-manager, apiGroup: rbac.authorization.k8s.io }
          EOF
          echo "---- labs PSA labels ----"
          kubectl get ns labs -o jsonpath='{.metadata.labels}' | tr ',' '\n' | grep pod-security || true
          # labs MUST be enforce=privileged: the lab pod is privileged DinD (runAsUser:0); baseline
          # and restricted would REJECT it at admission. Fail fast here if that ever regresses.
          enforce=$(kubectl get ns labs -o jsonpath='{.metadata.labels.pod-security\.kubernetes\.io/enforce}')
          if [ "$enforce" != "privileged" ]; then
            echo "FAIL: labs enforce='$enforce' (must be 'privileged' to admit the privileged DinD lab pod)"; exit 1
          fi
          echo "---- labs NetworkPolicies ----"; kubectl get netpol -n labs
          echo "---- labs RBAC ----"; kubectl get role,rolebinding -n labs
          echo "OK: labs namespace ready (enforce=privileged) + NetworkPolicies + RBAC applied."

      - name: Deploy ECR images to k3s + wait for rollouts
        run: |
          kubectl apply -f Backend-Java/e2e/k8s/e2e-stack.yaml
          # Plan 2 §5.5 CUTOVER: point the lab plane at the isolated `labs` namespace WITHOUT editing
          # the shared e2e-stack.yaml (so the sibling workflows e2e-k3s.yml / frontend-e2e-fullstack.yml
          # keep launching labs in `dev`). BOTH services read rosettacloud.lab.namespace <-
          # LAB_K8S_NAMESPACE; question-service execs (pods/exec) there too, so BOTH must be flipped or
          # setup/check would exec the wrong namespace. The VS now lives in `labs`, so reference the
          # gateway by its (dev) namespace (§5.5 step 3; inert in e2e — no Istio routing). `set env`
          # patches the pod template, so the rollout wait below lands the new (labs) generation before
          # the smoke test runs.
          kubectl set env deploy/lab-service deploy/question-service -n dev LAB_K8S_NAMESPACE=labs
          kubectl set env deploy/lab-service -n dev LAB_ISTIO_GATEWAY=dev/rosettacloud-gateway
          for d in localstack redis mock-oidc user-service lab-service question-service chat-service analytics-service; do
            kubectl rollout status deploy/$d -n dev --timeout=300s
          done
          echo "=== deployed images ==="
          kubectl get deploy -n dev -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.spec.template.spec.containers[0].image}{"\n"}{end}'
          echo "=== lab plane LAB_K8S_NAMESPACE (post set-env; must be 'labs') ==="
          kubectl -n dev get deploy lab-service question-service -o yaml | grep -A1 "LAB_K8S_NAMESPACE" || true

      # Plan 2 / hardening-plan 7.2: runtime-hardening verification (read-only asserts + negative PSA probe)
      - name: Assert hardened securityContext on services
        run: |
          # Prove the deployed services run under the restricted-profile securityContext baked into
          # e2e-stack.yaml: container[0].readOnlyRootFilesystem AND pod.runAsNonRoot must both be
          # true, else fail the job. Pure reads -- this does not mutate the cluster.
          for d in user-service lab-service question-service chat-service analytics-service; do
            ronly=$(kubectl -n dev get deploy $d -o jsonpath='{.spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem}')
            nonroot=$(kubectl -n dev get deploy $d -o jsonpath='{.spec.template.spec.securityContext.runAsNonRoot}')
            echo "$d -> readOnlyRootFilesystem=${ronly:-unset} runAsNonRoot=${nonroot:-unset}"
            if [ "$ronly" = "true" ] && [ "$nonroot" = "true" ]; then
              echo "  OK: $d hardened"
            else
              echo "  FAIL: $d is NOT hardened (readOnlyRootFilesystem=$ronly runAsNonRoot=$nonroot)"; exit 1
            fi
          done
          echo "All 5 services expose a hardened securityContext."

      - name: PSA restricted is enforced on dev (labs cutover — dev STAYS restricted)
        run: |
          # Label dev with the PSS 'restricted' profile, then prove enforcement with a NEGATIVE probe:
          # a default busybox pod (root, no seccomp, caps not dropped) MUST be rejected at admission.
          # PSA only gates NEW pods, so the already-running hardened service pods are unaffected.
          #
          # Plan 2 §5.5/§7.2 CUTOVER: the smoke test's privileged + runAsUser:0 lab pod now launches in
          # the dedicated `labs` namespace (enforce=privileged; LAB_K8S_NAMESPACE=labs on lab-service
          # AND question-service), NOT in `dev`. So — unlike the pre-cutover flow — we LEAVE dev
          # enforce=restricted ON for the rest of the job. This is the §7.2 end-state: dev=restricted
          # and labs=privileged in force together while the smoke test launches/execs/terminates a lab
          # in `labs`. The trap only cleans up the (rejected) probe pod; it no longer lifts the label.
          trap 'kubectl -n dev delete pod psa-probe --ignore-not-found >/dev/null 2>&1 || true' EXIT
          kubectl label ns dev pod-security.kubernetes.io/enforce=restricted --overwrite
          if kubectl -n dev run psa-probe --image=busybox --restart=Never --command -- sleep 1 2>/tmp/psa.err; then
            echo "FAIL: PSA 'restricted' did NOT reject a default (root) pod"; exit 1
          fi
          echo "---- admission error ----"; cat /tmp/psa.err || true
          grep -qi "violates PodSecurity" /tmp/psa.err
          echo "OK: PSA 'restricted' enforced on dev; the privileged lab pod runs in 'labs' (enforce=privileged)."

      - name: Port-forward
        run: |
          echo "127.0.0.1 mock-oidc" | sudo tee -a /etc/hosts
          kubectl port-forward -n dev svc/user-service 8081:8081 &
          kubectl port-forward -n dev svc/lab-service 8082:8082 &
          kubectl port-forward -n dev svc/question-service 8083:8083 &
          kubectl port-forward -n dev svc/chat-service 8084:8084 &
          kubectl port-forward -n dev svc/analytics-service 8085:8085 &
          kubectl port-forward -n dev svc/mock-oidc 8080:8080 &
          kubectl port-forward -n dev svc/localstack 4566:4566 &
          sleep 8

      - name: Smoke test — proves the ECR images run on k3s (no Bedrock)
        run: |
          python -m pip install --quiet httpx boto3
          SKIP_CHAT=1 python scripts/e2e/test_e2e.py

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -n dev -o wide || true
          kubectl get events -n dev --sort-by=.lastTimestamp | tail -40 || true
          echo "===== labs namespace (Plan 2 §5.5 cutover) ====="
          kubectl get ns labs --show-labels || true
          kubectl get pods,svc,netpol,resourcequota,limitrange -n labs -o wide || true
          kubectl get events -n labs --sort-by=.lastTimestamp | tail -40 || true
          # If a lab never reached "running", the pod's readiness/probe/PSA/quota reason shows here
          # (e.g. netpol dropped the kubelet probe -> Ready=false, or a quota/PSA admission reject).
          kubectl describe pods -n labs -l app=interactive-labs 2>/dev/null | tail -100 || true
          for d in user-service lab-service question-service chat-service analytics-service mock-oidc localstack; do
            echo "===== logs $d ====="
            kubectl logs -n dev deploy/$d --tail=80 --all-containers 2>/dev/null || true
          done
