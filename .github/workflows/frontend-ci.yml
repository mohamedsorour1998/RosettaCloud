name: Frontend CI

# PR/push gate for the Angular 22 SPA: typecheck + production build + Vitest unit
# tests, plus a dependency-vulnerability (npm audit) gate. Runs on Node 24
# (Angular 22 floor is Node >= 24.15.0 / >= 22.22.3).
on:
  push:
    branches: [main, frontend-angular22]
    paths:
      - "Frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "Frontend/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: build + Vitest (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx ng lint

      - name: Typecheck
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Build (production)
        run: npx ng build --configuration=production

      - name: Unit tests (Vitest)
        run: npx ng test --watch=false

      - name: Test summary
        if: always()
        run: echo "Vitest unit suite executed on $(node -v) with Angular $(npx ng version 2>/dev/null | grep -m1 -i 'Angular CLI' || true)" >> "$GITHUB_STEP_SUMMARY"

  # Deterministic, backend-independent Playwright e2e suite. Serves the
  # production build via a tiny committed Node static server (e2e/static-server.mjs)
  # and mocks every outbound API/Cognito/font call with page.route, so the suite
  # needs NO live backend / k3s and stays reliably green in CI.
  e2e:
    name: Playwright e2e (Node 24)
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Build (production)
        run: npx ng build --configuration=production

      - name: Playwright e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            Frontend/playwright-report
            Frontend/test-results
          retention-days: 7
          if-no-files-found: ignore

  security:
    name: npm audit (high+)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit (fail on high or critical)
        run: npm audit --audit-level=high

      - name: npm audit (full report, non-blocking)
        if: always()
        run: npm audit || true
