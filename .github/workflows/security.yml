name: Security Scan

# Supply-chain + SAST scanning for the Java backend and IaC.
#  - Trivy: dependency CVEs, committed secrets, IaC/Dockerfile misconfig.
#  - Semgrep: static analysis of the Java sources (informational).
on:
  push:
    branches: [main, spring-boot-migration]
    paths:
      - "Backend-Java/**"
      - "DevSecOps/**"
      - ".github/workflows/security.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1" # weekly Monday 05:00 UTC

permissions:
  contents: read

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin

      - name: Build jars (so Trivy sees resolved dependencies)
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "25"
          cache: maven
      - working-directory: Backend-Java
        run: ./mvnw -B -ntp -DskipTests package

      - name: Trivy report (HIGH+CRITICAL — informational)
        run: |
          trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 0 --no-progress Backend-Java
          trivy fs --scanners secret,misconfig --severity HIGH,CRITICAL --exit-code 0 --no-progress DevSecOps

      - name: Trivy gate (fail on fixable CRITICAL vuln or any secret)
        run: |
          echo "== secret gate (any committed secret fails) =="
          trivy fs --scanners secret --exit-code 1 --no-progress Backend-Java
          trivy fs --scanners secret --exit-code 1 --no-progress DevSecOps
          echo "== CVE gate (fixable CRITICAL fails) =="
          trivy fs --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress Backend-Java

      - name: Trivy misconfig regression gate (AVD-KSV-0118 must stay fixed)
        run: |
          set -uo pipefail
          # REGRESSION GATE — AVD-KSV-0118 "No Default Security Context" (HIGH).
          # Remediated per DevSecOps/POD-SECURITYCONTEXT-HARDENING-PLAN.md: pod- and container-level
          # securityContext (runAsNonRoot + runAsUser 1000, capabilities drop ALL,
          # allowPrivilegeEscalation=false, readOnlyRootFilesystem, seccompProfile RuntimeDefault) was
          # added to all five Spring Boot service Deployments. This gate FAILS the build if KSV-0118
          # reappears on any of them, so the fix cannot silently regress.
          # Scope = the five prod service manifests only. Documented exceptions that are NOT gated here:
          #   * e2e test-infra pods (localstack / redis / mock-oidc) in Backend-Java/e2e/k8s
          #   * runtime-created privileged interactive-lab pods (Fabric8LabProvisioner) — never scanned
          # trivy 'config' accepts a single target per invocation, so we loop per service.
          fail=0
          for d in user-service lab-service question-service chat-service analytics-service; do
            trivy config --quiet --format json -o "mc-$d.json" "Backend-Java/$d/k8s"
            hits=$(jq -r '.Results[]?.Misconfigurations[]? | (.ID // "") + " " + (.AVDID // "")' "mc-$d.json" \
                   | grep -Ec 'KSV-?0118' || true)
            if [ "${hits:-0}" -ne 0 ]; then
              echo "::error::AVD-KSV-0118 regressed in Backend-Java/$d/k8s ($hits finding(s))"
              trivy config --quiet --severity HIGH "Backend-Java/$d/k8s" || true
              fail=1
            else
              echo "OK: Backend-Java/$d/k8s is free of AVD-KSV-0118"
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Trivy misconfig regression gate FAILED — a remediated KSV-0118 finding reappeared."
            exit 1
          fi
          echo "Trivy misconfig regression gate PASSED — all five service manifests retain a securityContext."

  semgrep:
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep SAST (informational)
        continue-on-error: true
        run: |
          semgrep scan --config p/java --config p/security-audit --config p/secrets \
            --metrics off --error --severity ERROR Backend-Java
