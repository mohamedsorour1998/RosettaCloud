server:
  port: 8083

spring:
  application:
    name: question-service
  threads:
    virtual:
      enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URL:}

rosettacloud:
  aws:
    region: ${AWS_REGION:us-east-1}
  security:
    audience: ${COGNITO_CLIENT_ID:}
  questions:
    s3-bucket: ${S3_BUCKET_NAME:rosettacloud-shared-interactive-labs}
    cache-ttl-seconds: 3600
  lab:
    namespace: ${LAB_K8S_NAMESPACE:dev}
  clients:
    user-service-base-url: ${USER_SERVICE_URL:http://user-service.dev.svc.cluster.local:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
