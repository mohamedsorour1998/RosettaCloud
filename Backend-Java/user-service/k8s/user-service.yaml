apiVersion: v1
kind: ConfigMap
metadata:
  name: user-service-config
  namespace: dev
data:
  AWS_REGION: "us-east-1"
  COGNITO_ISSUER_URL: "https://cognito-idp.us-east-1.amazonaws.com/us-east-1_jPds5WJ0I"
  COGNITO_CLIENT_ID: "i5ilqkdrsl714trat6qkt0al0"
  USERS_TABLE_NAME: "rosettacloud-users"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rosettacloud-user-service
  namespace: dev
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::339712964409:role/rosettacloud-user-service-irsa
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rosettacloud-user-service
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rosettacloud-user-service
  template:
    metadata:
      labels:
        app: rosettacloud-user-service
    spec:
      serviceAccountName: rosettacloud-user-service
      containers:
        - name: user-service
          image: 339712964409.dkr.ecr.us-east-1.amazonaws.com/rosettacloud-user-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: user-service-config
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: dev
spec:
  selector:
    app: rosettacloud-user-service
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
  type: ClusterIP
