# Minimal VirtualService CRD so lab-service can create the resource in the e2e cluster
# (no full Istio install needed — routing isn't exercised; the probe talks to services directly).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: virtualservices.networking.istio.io
spec:
  group: networking.istio.io
  scope: Namespaced
  names:
    plural: virtualservices
    singular: virtualservice
    kind: VirtualService
    listKind: VirtualServiceList
    shortNames: [vs]
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
