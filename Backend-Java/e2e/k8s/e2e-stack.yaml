# Full-stack e2e overlay (namespace dev). Images are built in-runner and imported to k3s
# (imagePullPolicy: Never). AWS creds (from the assumed OIDC role) are injected as the
# aws-creds secret by the workflow: real Bedrock Nova Lite 2 for chat; ignored by LocalStack.
apiVersion: v1
kind: Namespace
metadata:
  name: dev
---
# ── LocalStack (DynamoDB) ──────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata: { name: localstack, namespace: dev }
spec:
  replicas: 1
  selector: { matchLabels: { app: localstack } }
  template:
    metadata: { labels: { app: localstack } }
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:3
          ports: [{ containerPort: 4566 }]
          env:
            - { name: SERVICES, value: "dynamodb,s3,sns,sqs" }
          readinessProbe:
            httpGet: { path: /_localstack/health, port: 4566 }
            initialDelaySeconds: 8
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: { name: localstack, namespace: dev }
spec:
  selector: { app: localstack }
  ports: [{ port: 4566, targetPort: 4566 }]
---
# ── Redis ──────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, namespace: dev }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: dev }
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
---
# ── Mock OIDC issuer (Cognito stand-in) ────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata: { name: mock-oidc, namespace: dev }
spec:
  replicas: 1
  selector: { matchLabels: { app: mock-oidc } }
  template:
    metadata: { labels: { app: mock-oidc } }
    spec:
      containers:
        - name: mock-oidc
          image: ghcr.io/navikt/mock-oauth2-server:2.1.10
          ports: [{ containerPort: 8080 }]
          env:
            - { name: SERVER_PORT, value: "8080" }
---
apiVersion: v1
kind: Service
metadata: { name: mock-oidc, namespace: dev }
spec:
  selector: { app: mock-oidc }
  ports: [{ port: 8080, targetPort: 8080 }]
---
# ── user-service ───────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata: { name: user-service, namespace: dev }
spec:
  replicas: 1
  selector: { matchLabels: { app: user-service } }
  template:
    metadata: { labels: { app: user-service } }
    spec:
      containers:
        - name: user-service
          image: rosettacloud-user-service:e2e
          imagePullPolicy: Never
          ports: [{ containerPort: 8081 }]
          envFrom:
            - secretRef: { name: aws-creds }
          env:
            - { name: AWS_REGION, value: "us-east-1" }
            - { name: DYNAMODB_ENDPOINT_URL, value: "http://localstack:4566" }
            - { name: COGNITO_ISSUER_URL, value: "http://mock-oidc:8080/default" }
            - { name: COGNITO_CLIENT_ID, value: "" }
            - { name: USERS_TABLE_NAME, value: "rosettacloud-users" }
            - { name: SPRING_APPLICATION_JSON, value: '{"rosettacloud":{"events":{"topic-arn":"arn:aws:sns:us-east-1:000000000000:rosettacloud-events","endpoint-override":"http://localstack:4566"}}}' }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8081 }
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata: { name: user-service, namespace: dev }
spec:
  selector: { app: user-service }
  ports: [{ port: 8081, targetPort: 8081 }]
---
# ── chat-service (real Nova Lite 2 via bedrock-direct) ─────────────────
apiVersion: apps/v1
kind: Deployment
metadata: { name: chat-service, namespace: dev }
spec:
  replicas: 1
  selector: { matchLabels: { app: chat-service } }
  template:
    metadata: { labels: { app: chat-service } }
    spec:
      containers:
        - name: chat-service
          image: rosettacloud-chat-service:e2e
          imagePullPolicy: Never
          ports: [{ containerPort: 8084 }]
          envFrom:
            - secretRef: { name: aws-creds }
          env:
            - { name: AWS_REGION, value: "us-east-1" }
            - { name: CHAT_INVOKER, value: "bedrock-direct" }
            - { name: NOVA_MODEL_ID, value: "us.amazon.nova-2-lite-v1:0" }
            - { name: REDIS_HOST, value: "redis" }
            - { name: REDIS_PORT, value: "6379" }
            - { name: COGNITO_ISSUER_URL, value: "http://mock-oidc:8080/default" }
            - { name: COGNITO_CLIENT_ID, value: "" }
            - { name: USER_SERVICE_URL, value: "http://user-service:8081" }
            - { name: SPRING_APPLICATION_JSON, value: '{"rosettacloud":{"events":{"topic-arn":"arn:aws:sns:us-east-1:000000000000:rosettacloud-events","endpoint-override":"http://localstack:4566"}}}' }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8084 }
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata: { name: chat-service, namespace: dev }
spec:
  selector: { app: chat-service }
  ports: [{ port: 8084, targetPort: 8084 }]
---
# ── analytics-service ──────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata: { name: analytics-service, namespace: dev }
spec:
  replicas: 1
  selector: { matchLabels: { app: analytics-service } }
  template:
    metadata: { labels: { app: analytics-service } }
    spec:
      containers:
        - name: analytics-service
          image: rosettacloud-analytics-service:e2e
          imagePullPolicy: Never
          ports: [{ containerPort: 8085 }]
          envFrom:
            - secretRef: { name: aws-creds }
          env:
            - { name: AWS_REGION, value: "us-east-1" }
            - { name: DYNAMODB_ENDPOINT_URL, value: "http://localstack:4566" }
            - { name: COGNITO_ISSUER_URL, value: "http://mock-oidc:8080/default" }
            - { name: COGNITO_CLIENT_ID, value: "" }
            - { name: USERS_TABLE_NAME, value: "rosettacloud-users" }
            - { name: SPRING_APPLICATION_JSON, value: '{"rosettacloud":{"events":{"queue-url":"http://localstack:4566/000000000000/rosettacloud-analytics","endpoint-override":"http://localstack:4566","poll-ms":2000}}}' }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8085 }
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata: { name: analytics-service, namespace: dev }
spec:
  selector: { app: analytics-service }
  ports: [{ port: 8085, targetPort: 8085 }]
---
# RBAC for the default SA so lab-service can manage Pods/Services/VirtualServices and
# question-service can exec into lab pods (e2e cluster is ephemeral).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: e2e-lab-manager, namespace: dev }
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/status", "pods/exec", "services"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["networking.istio.io"]
    resources: ["virtualservices"]
    verbs: ["create", "get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: e2e-lab-manager, namespace: dev }
subjects:
  - { kind: ServiceAccount, name: default, namespace: dev }
roleRef: { kind: Role, name: e2e-lab-manager, apiGroup: rbac.authorization.k8s.io }
---
# ── lab-service ─────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata: { name: lab-service, namespace: dev }
spec:
  replicas: 1
  selector: { matchLabels: { app: lab-service } }
  template:
    metadata: { labels: { app: lab-service } }
    spec:
      containers:
        - name: lab-service
          image: rosettacloud-lab-service:e2e
          imagePullPolicy: Never
          ports: [{ containerPort: 8082 }]
          env:
            - { name: LAB_K8S_NAMESPACE, value: "dev" }
            - { name: LAB_POD_IMAGE, value: "rosettacloud-lab-stub:e2e" }
            - { name: LAB_ISTIO_GATEWAY, value: "rosettacloud-gateway" }
            - { name: LAB_WILDCARD_DOMAIN, value: "labs.dev.rosettacloud.app" }
            - { name: LAB_POD_TTL_SECS, value: "3600" }
            - { name: COGNITO_ISSUER_URL, value: "http://mock-oidc:8080/default" }
            - { name: COGNITO_CLIENT_ID, value: "" }
            - { name: USER_SERVICE_URL, value: "http://user-service:8081" }
            - { name: SPRING_APPLICATION_JSON, value: '{"rosettacloud":{"events":{"topic-arn":"arn:aws:sns:us-east-1:000000000000:rosettacloud-events","endpoint-override":"http://localstack:4566"}}}' }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8082 }
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata: { name: lab-service, namespace: dev }
spec:
  selector: { app: lab-service }
  ports: [{ port: 8082, targetPort: 8082 }]
---
# ── question-service ────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata: { name: question-service, namespace: dev }
spec:
  replicas: 1
  selector: { matchLabels: { app: question-service } }
  template:
    metadata: { labels: { app: question-service } }
    spec:
      containers:
        - name: question-service
          image: rosettacloud-question-service:e2e
          imagePullPolicy: Never
          ports: [{ containerPort: 8083 }]
          envFrom:
            - secretRef: { name: aws-creds }
          env:
            - { name: AWS_REGION, value: "us-east-1" }
            - { name: S3_BUCKET_NAME, value: "rosettacloud-shared-interactive-labs" }
            - { name: LAB_K8S_NAMESPACE, value: "dev" }
            - { name: COGNITO_ISSUER_URL, value: "http://mock-oidc:8080/default" }
            - { name: COGNITO_CLIENT_ID, value: "" }
            - { name: USER_SERVICE_URL, value: "http://user-service:8081" }
            # S3 -> LocalStack (relaxed-binding-safe via SPRING_APPLICATION_JSON)
            - { name: SPRING_APPLICATION_JSON, value: '{"rosettacloud":{"aws":{"s3":{"endpoint-override":"http://localstack:4566"}},"events":{"topic-arn":"arn:aws:sns:us-east-1:000000000000:rosettacloud-events","endpoint-override":"http://localstack:4566"}}}' }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8083 }
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata: { name: question-service, namespace: dev }
spec:
  selector: { app: question-service }
  ports: [{ port: 8083, targetPort: 8083 }]
