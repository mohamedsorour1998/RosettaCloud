apiVersion: v1
kind: ConfigMap
metadata:
  name: chat-service-config
  namespace: dev
data:
  AWS_REGION: "us-east-1"
  COGNITO_ISSUER_URL: "https://cognito-idp.us-east-1.amazonaws.com/us-east-1_jPds5WJ0I"
  COGNITO_CLIENT_ID: "i5ilqkdrsl714trat6qkt0al0"
  # ── AI invoker toggle — AGENTCORE-RESILIENCE4J-RUNTIME-PLAN.md §A.2 / §A.4 ──
  # agentcore      : prod default; IAM InvokeAgentRuntime -> managed Python Strands/Nova runtime (MCP tools + memory).
  # bedrock-direct : graceful fallback; Nova Lite 2 Converse, same tutor/grader/planner prompts, no tools/memory.
  #   Fail over in seconds (bean is @ConditionalOnProperty, so a rollout is required):
  #     kubectl set env deploy/rosettacloud-chat-service -n dev CHAT_INVOKER=bedrock-direct   # fail back: =agentcore
  # PRECONDITION (verified 2026-07-02, acct 339712964409): the runtime below is control-plane READY
  # (endpoint DEFAULT, liveVersion 33, role rosettacloud-agentcore-runtime-role) BUT a direct InvokeAgentRuntime
  # smoke returned HTTP 502 with no application logs since 2026-05-06 — its agent image repo
  # (ECR bedrock-agentcore-rosettacloud_education_agent) was deleted, so cold starts cannot pull the container.
  # Restoring it is a REBUILD (agentcore launch -> CodeBuild ARM64), DEFERRED pending approval (§A.1.5). Until the
  # rebuild reports READY on a real invoke, run prod with CHAT_INVOKER=bedrock-direct; the ARN is retained as the
  # canonical target so no ConfigMap change is needed once the rebuild completes (the registered ARN is unchanged).
  CHAT_INVOKER: "agentcore"
  AGENT_RUNTIME_ARN: "arn:aws:bedrock-agentcore:us-east-1:339712964409:runtime/rosettacloud_education_agent-yebWcC9Yqy"
  NOVA_MODEL_ID: "us.amazon.nova-2-lite-v1:0"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  USER_SERVICE_URL: "http://user-service.dev.svc.cluster.local:8081"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rosettacloud-chat-service
  namespace: dev
  # NO-EKS mandate: credentials come from the EC2 instance profile (persistent node, Part C) or the
  # `aws-creds` secret (k3s-in-runner), resolved by DefaultCredentialsProvider — NOT IRSA. The former
  # eks.amazonaws.com/role-arn annotation was dormant (it referenced an OIDC provider that does not
  # exist) and is removed to avoid confusion. See AGENTCORE-RESILIENCE4J-RUNTIME-PLAN.md §A.2.2 / §C.2.6.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rosettacloud-chat-service
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rosettacloud-chat-service
  template:
    metadata:
      labels:
        app: rosettacloud-chat-service
    spec:
      serviceAccountName: rosettacloud-chat-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
      containers:
        - name: chat-service
          image: 339712964409.dkr.ecr.us-east-1.amazonaws.com/rosettacloud-chat-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8084
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          envFrom:
            - configMapRef:
                name: chat-service-config
            # AgentCore path credentials (NO EKS => NO IRSA): the aws-creds secret supplies
            # AWS_ACCESS_KEY_ID/SECRET/SESSION_TOKEN on k3s-in-runner / the interim persistent node so
            # DefaultCredentialsProvider in AgentCoreInvoker can call bedrock-agentcore:InvokeAgentRuntime.
            # optional=true => harmless once an EC2 instance profile supplies creds via IMDS (Part C §C.2.6).
            # Only the agentcore invoker needs this; bedrock-direct also uses it for Converse. See §A.2.2.
            - secretRef:
                name: aws-creds
                optional: true
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Djava.io.tmpdir=/tmp"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8084
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
              ephemeral-storage: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
---
apiVersion: v1
kind: Service
metadata:
  name: chat-service
  namespace: dev
spec:
  selector:
    app: rosettacloud-chat-service
  ports:
    - protocol: TCP
      port: 8084
      targetPort: 8084
  type: ClusterIP
