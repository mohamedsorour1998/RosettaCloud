server:
  port: 8084

spring:
  application:
    name: chat-service
  cloud:
    # The Part B CircuitBreaker starter pulls Spring Cloud 2025.1.0, whose CompatibilityVerifier
    # validates only Spring Boot 4.0.x and would abort startup on our Boot 4.1.0 (CrashLoopBackOff).
    # The resilience4j adapter works on 4.1.0 (CB tests + full-stack e2e prove it), so disable the
    # conservative version guard — identical fix to lab-service.
    compatibility-verifier:
      enabled: false
  threads:
    virtual:
      enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URL:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

rosettacloud:
  aws:
    region: ${AWS_REGION:us-east-1}
  security:
    audience: ${COGNITO_CLIENT_ID:}
  chat:
    invoker: ${CHAT_INVOKER:agentcore}          # agentcore | bedrock-direct
    agent-runtime-arn: ${AGENT_RUNTIME_ARN:}
    model-id: ${NOVA_MODEL_ID:us.amazon.nova-2-lite-v1:0}
    session-ttl-seconds: 14400
    history-max-messages: 40
    rate-limit-per-hour: 30
  clients:
    user-service-base-url: ${USER_SERVICE_URL:http://user-service.dev.svc.cluster.local:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

# Circuit-breaker tuning (Part B §B.3.2) for the "ai-plane" breaker in ChatService. The Spring Cloud
# CircuitBreaker factory resolves create(id) against the resilience4j registry's "default"
# configuration, so these configs.default values apply to the ai-plane breaker (the only breaker in
# chat-service). Design notes:
#   * minimum-number-of-calls: 20 — the breaker never evaluates the failure rate (never trips) until it
#     has seen 20 calls, so a low-volume/e2e run cannot open it; the breaker only protects against a
#     SUSTAINED outage under real traffic.
#   * TimeLimiter timeout-duration: 60s — deliberately generous. A real AgentCore/Nova reply can take
#     many seconds; the limiter must NOT cut off a slow-but-successful call (which would falsely degrade
#     a healthy turn to the "tutor unavailable" fallback and break the real-Bedrock e2e). The
#     failure-rate breaker is the primary protection; the limiter only guards against a true hang.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    configs:
      default:
        timeout-duration: 60s
