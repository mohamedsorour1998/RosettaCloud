server:
  port: 8082

spring:
  application:
    name: lab-service
  cloud:
    # B.3 regression fix: Spring Cloud 2025.1.0 (the CircuitBreaker starter's release train) validates
    # only against Spring Boot 4.0.x, but this project runs Boot 4.1.0. Its runtime CompatibilityVerifier
    # therefore aborts startup ("Spring Boot [4.1.0] is not compatible with this Spring Cloud release
    # train ... [4.0.x]") -> CrashLoopBackOff. The spring-cloud-circuitbreaker-resilience4j adapter is a
    # thin, stable wrapper that works correctly on 4.1.0 (proven by the CB unit tests and the full-stack
    # e2e), so disable the conservative version guard rather than pinning Spring Boot back to 4.0.x.
    compatibility-verifier:
      enabled: false
  threads:
    virtual:
      enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URL:}

rosettacloud:
  security:
    audience: ${COGNITO_CLIENT_ID:}
  lab:
    namespace: ${LAB_K8S_NAMESPACE:dev}
    pod-image: ${LAB_POD_IMAGE:339712964409.dkr.ecr.us-east-1.amazonaws.com/interactive-labs:latest}
    wildcard-domain: ${LAB_WILDCARD_DOMAIN:labs.dev.rosettacloud.app}
    istio-gateway: ${LAB_ISTIO_GATEWAY:rosettacloud-gateway}
    pod-ttl-seconds: ${LAB_POD_TTL_SECS:3600}
  clients:
    user-service-base-url: ${USER_SERVICE_URL:http://user-service.dev.svc.cluster.local:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

# Circuit breaker tuning (Part B §B.3.2). The Spring Cloud CircuitBreaker factory delegates config
# resolution to the resilience4j registry's named "default" configuration, so with the
# resilience4j-spring-boot3 starter on the classpath these properties (NOT a Spring Cloud
# Customizer bean) are the effective way to tune the breaker. create("user-session") uses group
# "default", so configs.default applies to lab-service's cross-boundary breaker.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    configs:
      default:
        # Headroom over the client's 5s read timeout so a slow-but-successful user-service response is
        # not falsely counted as a timeout (overrides Spring Cloud's 1s default TimeLimiter).
        timeout-duration: 6s
