server:
  port: 8082

spring:
  application:
    name: lab-service
  threads:
    virtual:
      enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URL:}

rosettacloud:
  security:
    audience: ${COGNITO_CLIENT_ID:}
  lab:
    namespace: ${LAB_K8S_NAMESPACE:dev}
    pod-image: ${LAB_POD_IMAGE:339712964409.dkr.ecr.us-east-1.amazonaws.com/interactive-labs:latest}
    wildcard-domain: ${LAB_WILDCARD_DOMAIN:labs.dev.rosettacloud.app}
    istio-gateway: ${LAB_ISTIO_GATEWAY:rosettacloud-gateway}
    pod-ttl-seconds: ${LAB_POD_TTL_SECS:3600}
  clients:
    user-service-base-url: ${USER_SERVICE_URL:http://user-service.dev.svc.cluster.local:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
